<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebGL Fluid (Lite)</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { width: 100%; height: 100%; display: block; }

    .hud {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 10;
      font: 12px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: rgba(255,255,255,0.9);
      background: rgba(0,0,0,0.35);
      padding: 10px 10px;
      border-radius: 10px;
      backdrop-filter: blur(6px);
      user-select: none;
    }

    .hud .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
    .hud label { display: inline-flex; align-items: center; gap: 6px; }
    .hud input[type="range"] { width: 150px; }
    .hud button {
      border: 0;
      border-radius: 10px;
      padding: 6px 10px;
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.9);
      cursor: pointer;
    }
    .hud button:hover { background: rgba(255,255,255,0.22); }

    .warn {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 14px;
      font: 12px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: rgba(255,255,255,0.95);
      background: rgba(180, 50, 50, 0.65);
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="hud" id="hud">
    <div><b>WebGL Fluid (Lite)</b></div>
    <div>Drag / touch to stir. Right-click drag adds dye only.</div>
    <div class="row">
      <label>Quality <input id="quality" type="range" min="0.5" max="1.75" step="0.05" value="1.0"></label>
      <label>Vorticity <input id="vort" type="range" min="0" max="50" step="1" value="25"></label>
    </div>
    <div class="row">
      <label>Dissipation <input id="diss" type="range" min="0.90" max="1.0" step="0.002" value="0.985"></label>
      <label>Pressure iters <input id="iters" type="range" min="5" max="50" step="1" value="20"></label>
    </div>
    <div class="row">
      <button id="clear">Clear</button>
      <button id="pause">Pause</button>
      <span id="stats"></span>
    </div>
  </div>

  <div class="warn" id="warn"></div>

  <script src="main.js"></script>
</body>
</html>
